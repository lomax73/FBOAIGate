  <path d="M 100 42 L 148 59 L 148 103 C 148 135 127 154 100 162 C 73 154 52 135 52 103 L 52 59 Z"
        fill="none" stroke="#1f8fc4" stroke-width="10" stroke-linejoin="round"/>

  <path d="M 100 56 C 90 52 78 56 74 64 C 66 68 65 79 72 85 C 71 93 78 99 87 97 C 91 101 97 100 100 96 Z"
        fill="#1f8fc4"/>

  <g stroke="#1f8fc4" stroke-width="5" stroke-linecap="round">
    <line x1="106" y1="66" x2="126" y2="66"/>
    <line x1="106" y1="78" x2="130" y2="78"/>
    <line x1="106" y1="90" x2="124" y2="90"/>
  </g>

  <path d="M 82 116 L 100 131 L 82 146" fill="none" stroke="#eaf4f8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="106" y1="146" x2="124" y2="146" stroke="#eaf4f8" stroke-width="12" stroke-linecap="round"/>
</svg>
