{% load static %}<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login — FBOAIGate</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'img/logo.svg' %}?v=2">
    <style>
        :root {
            --accent: #1f8fc4;
            --accent-dark: #176f9b;
            --spark: #e0a340;
            --symbol: #eaf4f8;
            --bg-a: #0f2029;
            --bg-b: #16303d;
            --border: #24404e;
            --font: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace;
        }
        * { box-sizing: border-box; }
        body {
            font-family: var(--font);
            color: var(--symbol);
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(160deg, var(--bg-a) 0%, var(--bg-b) 100%);
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: "";
            position: absolute;
            width: 900px; height: 900px;
            border-radius: 50%;
            border: 60px solid var(--accent);
            opacity: 0.06;
            top: -320px;
            right: -320px;
        }
        body::after {
            content: "";
            position: absolute;
            width: 500px; height: 500px;
            border-radius: 50%;
            border: 40px solid var(--spark);
            opacity: 0.05;
            bottom: -220px;
            left: -220px;
        }
        .card {
            position: relative;
            background: rgba(22, 48, 61, 0.9);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2.5rem 2.5rem 2rem;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
            text-align: center;
        }
        .card img { width: 64px; height: 64px; margin-bottom: 1rem; }
        .card h1 { font-size: 1.2rem; margin: 0 0 1.5rem; font-weight: 700; }
        .card h1 .ai { color: var(--spark); }
        form { text-align: left; }
        p { margin: 0.9rem 0; }
        label { display: block; font-weight: 600; margin-bottom: 0.3rem; font-size: 0.8rem; color: var(--symbol); }
        input {
            width: 100%; padding: 0.6rem 0.7rem; box-sizing: border-box;
            border: 1px solid var(--border); border-radius: 8px; font-family: var(--font); font-size: 0.9rem;
            background: rgba(0,0,0,0.2); color: var(--symbol);
        }
        input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
        .btn {
            width: 100%; padding: 0.65rem 1rem; border-radius: 8px;
            background: var(--accent); color: #fff; border: none; cursor: pointer;
            font-size: 0.95rem; font-weight: 600; font-family: var(--font);
            margin-top: 0.5rem;
        }
        .btn:hover { background: var(--accent-dark); }
        .errorlist { list-style: none; padding: 0; margin: 0 0 1rem; color: #f87171; font-size: 0.8rem; }
        .footer-note { margin-top: 1.5rem; font-size: 0.7rem; color: #6b8894; }
    </style>
</head>
<body>
<div class="card">
    <img src="{% static 'img/logo.svg' %}" alt="FBOAIGate">
    <h1>FBO<span class="ai">AI</span>Gate</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        <p>
            <label for="{{ form.username.id_for_label }}">Username</label>
            {{ form.username }}
            {{ form.username.errors }}
        </p>
        <p>
            <label for="{{ form.password.id_for_label }}">Password</label>
            {{ form.password }}
            {{ form.password.errors }}
        </p>
        <button class="btn" type="submit">Accedi</button>
    </form>
    <p class="footer-note">FBO Solution</p>
</div>
</body>
</html>
