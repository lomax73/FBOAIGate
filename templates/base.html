<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <title>{% block title %}FBOAIGate{% endblock %}</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; }
        header { padding: 1rem 1.5rem; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center; }
        header a { color: #e2e8f0; text-decoration: none; font-weight: 600; }
        main { padding: 1.5rem; max-width: 900px; margin: 0 auto; }
        .btn { background: #2563eb; color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
        .btn-danger { background: #dc2626; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid #1e293b; }
        .dot { display: inline-block; width: 0.6rem; height: 0.6rem; border-radius: 50%; margin-right: 0.4rem; }
        .dot-online { background: #22c55e; }
        .dot-offline { background: #64748b; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
<header>
    <a href="{% url 'target-list' %}">FBOAIGate</a>
    {% if user.is_authenticated %}
    <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button class="btn" type="submit">Esci ({{ user }})</button>
    </form>
    {% endif %}
</header>
<main>
{% block content %}{% endblock %}
</main>
<script>
  window.FBOFLAG_APP = "fboaigate";
  window.FBOFLAG_USER = "{{ request.user.username|default:'' }}";
  window.FBOFLAG_HUB = "https://feedback.fbosolution.it";
</script>
<script src="https://feedback.fbosolution.it/static/fboflag.js" defer></script>
</body>
</html>
