server {
    listen 443 ssl;
    server_name aigate.fbosolution.it;

    ssl_certificate /etc/letsencrypt/live/aigate.fbosolution.it/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/aigate.fbosolution.it/privkey.pem; # managed by Certbot

    client_max_body_size 20M;

    location /static/ {
        alias /opt/fboaigate/app/staticfiles/;
    }

    location /api/internal/ {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://unix:/run/fboaigate/daphne.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://unix:/run/fboaigate/daphne.sock;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
