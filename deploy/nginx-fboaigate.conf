server {
    listen 443 ssl;
    server_name aigate.fbosolution.it;

    # Provvisorio: certificato self-signed finché il DNS non è propagato.
    # Passare a Let's Encrypt appena confermato: certbot --nginx -d aigate.fbosolution.it
    ssl_certificate     /etc/ssl/fboaigate/selfsigned.crt;
    ssl_certificate_key /etc/ssl/fboaigate/selfsigned.key;

    client_max_body_size 20M;

    location /static/ {
        alias /opt/fboaigate/app/staticfiles/;
    }

    location / {
        proxy_pass http://unix:/run/fboaigate/daphne.sock;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
