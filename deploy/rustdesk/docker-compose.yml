# Server RustDesk self-hosted (hbbs = rendezvous/ID, hbbr = relay).
# Da lanciare sul VPS (anche come risorsa Docker Compose in Coolify).
# Prima di avviare: sostituire aigate.fbosolution.it con il nome DNS scelto.
services:
  hbbs:
    image: rustdesk/rustdesk-server:latest
    # "-k _" = rifiuta client senza la chiave del server (niente connessioni non cifrate)
    command: hbbs -r aigate.fbosolution.it:21117 -k _
    network_mode: host
    volumes:
      - ./data:/root
    depends_on: [hbbr]
    restart: unless-stopped
  hbbr:
    image: rustdesk/rustdesk-server:latest
    command: hbbr -k _
    network_mode: host
    volumes:
      - ./data:/root
    restart: unless-stopped
